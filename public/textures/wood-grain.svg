<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="none">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="5" seed="12" result="noise" />
    <feColorMatrix
      in="noise"
      type="matrix"
      values="0 0 0 0 0.42
              0 0 0 0 0.27
              0 0 0 0 0.12
              0 0 0 0.85 0"
    />
  </filter>
  <filter id="knot">
    <feTurbulence type="turbulence" baseFrequency="0.02 0.03" numOctaves="2" seed="4" result="swirl" />
    <feColorMatrix
      in="swirl"
      type="matrix"
      values="0 0 0 0 0.25
              0 0 0 0 0.15
              0 0 0 0 0.06
              0 0 0 0.35 0"
    />
  </filter>
  <rect width="100%" height="100%" fill="#7a4d22" />
  <rect width="100%" height="100%" filter="url(#grain)" />
  <rect width="100%" height="100%" filter="url(#knot)" />
  <g stroke="#3a2510" stroke-width="4" opacity="0.55">
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
    <line x1="0" y1="360" x2="600" y2="360" />
    <line x1="0" y1="450" x2="600" y2="450" />
    <line x1="0" y1="540" x2="600" y2="540" />
    <line x1="0" y1="630" x2="600" y2="630" />
    <line x1="0" y1="720" x2="600" y2="720" />
    <line x1="0" y1="810" x2="600" y2="810" />
  </g>
  <g stroke="#c99a4a" stroke-width="1.2" opacity="0.35">
    <line x1="0" y1="93" x2="600" y2="93" />
    <line x1="0" y1="183" x2="600" y2="183" />
    <line x1="0" y1="273" x2="600" y2="273" />
    <line x1="0" y1="363" x2="600" y2="363" />
    <line x1="0" y1="453" x2="600" y2="453" />
    <line x1="0" y1="543" x2="600" y2="543" />
    <line x1="0" y1="633" x2="600" y2="633" />
    <line x1="0" y1="723" x2="600" y2="723" />
    <line x1="0" y1="813" x2="600" y2="813" />
  </g>
</svg>
